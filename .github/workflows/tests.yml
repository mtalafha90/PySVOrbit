name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -v

      - name: Item-1 covariance report
        env:
          MPLBACKEND: Agg
        run: python scripts/item1_covariance_report.py

      - name: Check the web application imports
        env:
          MPLBACKEND: Agg
        run: python -c "import app; print('app imports cleanly')"
